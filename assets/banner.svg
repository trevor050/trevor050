<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-labelledby="t d">
  <title id="t">Trevor Rosato</title>
  <desc id="d">Software cost is collapsing. Distribution and people who care are the hard part.</desc>
  <defs>
    <clipPath id="card"><rect width="1280" height="360" rx="22"/></clipPath>
    <filter id="soft" x="-30%" y="-80%" width="160%" height="260%">
      <feGaussianBlur stdDeviation="78"/>
    </filter>
    <linearGradient id="fall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0c0f" stop-opacity="0"/>
      <stop offset="0.62" stop-color="#0b0c0f" stop-opacity="0.86"/>
      <stop offset="1" stop-color="#0b0c0f" stop-opacity="1"/>
    </linearGradient>
    <style>
      .glow { animation: drift 48s linear infinite; transform-origin: 640px 0; }
      .a { animation: sway 19s ease-in-out infinite alternate; }
      .b { animation: sway 23s ease-in-out infinite alternate-reverse; }
      @keyframes drift { from { filter: hue-rotate(0deg); } to { filter: hue-rotate(360deg); } }
      @keyframes sway { from { transform: translateX(-46px); } to { transform: translateX(46px); } }
      @media (prefers-reduced-motion: reduce) { .glow, .a, .b { animation: none; } }
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1280" height="360" fill="#0b0c0f"/>
    <g class="glow">
      <g filter="url(#soft)" opacity="0.62">
        <ellipse class="a" cx="300" cy="-30" rx="420" ry="150" fill="#2f6f7a"/>
        <ellipse class="b" cx="860" cy="-50" rx="460" ry="170" fill="#3a5a9a"/>
        <ellipse class="a" cx="1180" cy="-10" rx="260" ry="120" fill="#2a8a86"/>
      </g>
    </g>
    <rect width="1280" height="360" fill="url(#fall)"/>

    <text x="76" y="94" font-size="13" font-weight="500" letter-spacing="4.4" fill="#8b919c">ULM</text>
    <text x="72" y="214" font-size="68" font-weight="200" letter-spacing="-1.2" fill="#f3f4f6">Trevor Rosato</text>
    <text x="76" y="262" font-size="21" font-weight="300" fill="#a3a9b4">Software cost is collapsing. Distribution and people who care are the hard part.</text>
    <text x="1204" y="312" font-size="14" font-weight="400" text-anchor="end" letter-spacing="0.4" fill="#7b818c">trevorrosato.com</text>
  </g>
</svg>
